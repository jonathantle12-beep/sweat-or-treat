<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sweat or Treat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one centred phone column of sticker cards over a fixed pastel sky scene. */
:root{
  --navy:#1F1B3A; --muted:#4A4570; --card:#FFFFFF;
  --sky1:#A9D8FB; --sky2:#CBDCFF; --sky3:#EADDFB;
  --jon:#4F8DF7; --jon-soft:#D6E6FF; --ming:#F76FA8; --ming-soft:#FFDCEA;
  --mint:#A9EFD0; --butter:#FFE58A; --peri:#DCE0FF;
  --display:'Baloo 2','Trebuchet MS',sans-serif; --body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--sky2);color:var(--navy);font-family:var(--body);font-weight:700;font-size:15px;line-height:1.35}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}

/* sky */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 48%,var(--sky3) 100%)}
.sky svg.deco{position:absolute}
.cloud{position:absolute;width:150px;height:56px;animation:drift linear infinite}
.sun{position:absolute;top:26px;right:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#FFF6C9 0 45%,rgba(255,246,201,.45) 46% 70%,rgba(255,246,201,0) 71%)}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:190px}
.twinkle{animation:twinkle 3.2s ease-in-out infinite}
.float{animation:floaty 6s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(110vw)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:2px solid var(--navy);border-radius:24px;padding:16px;box-shadow:0 4px 0 rgba(31,27,58,.9)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--navy);background:var(--butter);font-weight:800;font-size:14px;text-decoration:none;color:var(--navy)}
.pill.white{background:#fff}
.link{background:none;border:0;padding:8px 4px;min-height:44px;font-weight:800;font-size:13px;text-decoration:underline}

/* who */
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.who button{border:2px solid var(--navy);border-radius:24px;padding:14px 8px;box-shadow:0 5px 0 var(--navy);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800}
.who .n{font-family:var(--display);font-size:26px;line-height:1}
.bg-jon{background:var(--jon-soft)} .bg-ming{background:var(--ming-soft)}

/* players */
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.player{padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.player .n{font-family:var(--display);font-size:22px;line-height:1}
.tag{display:inline-block;padding:1px 10px;border-radius:12px;border:2px solid var(--navy);font-size:12px;font-weight:800}
.mascot{animation:bounce 2.4s ease-in-out infinite}
.mascot.happy{animation-duration:.9s}
.mascot.sad{animation:none}
.flame{display:inline-flex;align-items:center;gap:3px;font-size:13px}

/* today */
.big{width:100%;min-height:68px;border-radius:34px;border:2px solid var(--navy);background:var(--butter);font-family:var(--display);font-weight:800;font-size:26px;box-shadow:0 6px 0 var(--navy);animation:wobble 2.2s ease-in-out infinite}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
.big:disabled{opacity:.6;animation:none}
.done{background:var(--mint);border:2px solid var(--navy);border-radius:22px;padding:12px 14px;animation:pop .35s ease-out}
.done h3{font-size:21px}
.small{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--navy);background:#fff;font-weight:800;font-size:13px}

/* progress + grid */
.bar{height:14px;border-radius:8px;border:2px solid var(--navy);background:#fff;overflow:hidden}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;font-size:13px;font-weight:800}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--navy);vertical-align:-2px}
.dot.jon{background:var(--jon)} .dot.ming{background:var(--ming)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border-radius:12px;background:#F3F5FF;padding:5px 0 7px;text-align:center;font-family:var(--display);font-weight:800;font-size:15px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.day.today{border-color:var(--navy);background:var(--butter)}
.day.past{background:var(--peri)}
.day.future{color:#5A5675}
.m{width:14px;height:14px;border-radius:50%;display:block;font-size:13px;line-height:11px;font-family:var(--body);font-weight:800}
.m.ok.jon{background:var(--jon);border:2px solid var(--navy)}
.m.ok.ming{background:var(--ming);border:2px solid var(--navy)}
.sky svg.deco{opacity:.6}
.m.todo.jon{border:3px solid var(--jon);background:#fff}
.m.todo.ming{border:3px solid var(--ming);background:#fff}
.m.future{border:2px dashed #B9BEDD}
.banner{background:var(--butter)}
.tier{display:flex;gap:12px;align-items:center}
.num{width:52px;height:52px;flex:none;border-radius:50%;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px}
.tier h3{font-size:22px}
.here{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.score{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.err{background:#FFE1E1}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<main class="app" id="app"></main>

<script>
(function(){
"use strict";
var API="https://c--93994e4d-5fa3-47dd-ab8f-2254bef4e86e-prod.lovable.cloud/rest/v1/ticks";
var KEY="sb_publishable_vLLNTYMaiFULfinAryhxKw_oFgrNLh2";
var VIDEO="https://youtu.be/2MoGxae-zyo";
var START=Date.UTC(2026,10,15), DAYS=14, TZ=7*3600000;
var PEOPLE={jon:{name:"Jon",pet:"Tofu the seal"},ming:{name:"Ming",pet:"Miso the otter"}};
var TIERS=[null,"Krua Bangna","a Japanese dinner","Omakase"];
var ticks=[], loaded=false, failed=false, busy=false, me=null, view="home";
try{var s=localStorage.getItem("sot:me"); if(s==="jon"||s==="ming") me=s;}catch(e){}

/* 21 Nov 2026 (internet outage) is skipped: 22 Nov is Day 7, so Day 14 is 29 Nov. */
function today(){var raw=Math.floor((Date.now()+TZ-START)/86400000)+1;return raw>=8?raw-1:raw;}
function has(p,d){return ticks.some(function(t){return t.person===p&&t.day===d;});}
function tickOf(p,d){return ticks.filter(function(t){return t.person===p&&t.day===d;})[0];}
function doneCount(p){return ticks.filter(function(t){return t.person===p;}).length;}
function misses(p){var n=0,last=Math.min(today()-1,DAYS);for(var d=1;d<=last;d++) if(!has(p,d)) n++;return n;}
function streak(p){var d=Math.min(today(),DAYS); if(!has(p,d)) d--; var n=0; while(d>=1&&has(p,d)){n++;d--;} return n;}
function owes(p){return TIERS[Math.min(misses(p),3)];}
function other(p){return p==="jon"?"ming":"jon";}
function clock(iso){try{return new Date(iso).toLocaleTimeString("en-GB",{timeZone:"Asia/Bangkok",hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}

function call(method,query,body){
  return fetch(API+(query||""),{method:method,headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:body?JSON.stringify(body):undefined})
    .then(function(r){ if(!r.ok&&r.status!==409) throw new Error("HTTP "+r.status); return r; });
}
function load(){
  return call("GET","?select=person,day,ticked_at&order=day").then(function(r){return r.json();}).then(function(rows){
    ticks=(rows||[]).filter(function(t){return (t.person==="jon"||t.person==="ming")&&t.day>=1&&t.day<=DAYS;});
    loaded=true; failed=false; render();
  }).catch(function(){ failed=true; render(); });
}
function tick(){
  var d=today(); if(busy||!me||d<1||d>DAYS||has(me,d)) return;
  busy=true; ticks.push({person:me,day:d,ticked_at:new Date().toISOString()}); render(); confetti();
  call("POST","",{person:me,day:d}).catch(function(){failed=true;}).then(function(){busy=false; return load();});
}
function undo(){
  var d=today(); if(busy||!me) return;
  busy=true; ticks=ticks.filter(function(t){return !(t.person===me&&t.day===d);}); render();
  call("DELETE","?person=eq."+me+"&day=eq."+d).catch(function(){failed=true;}).then(function(){busy=false; return load();});
}

/* ---------- mascots: original seal (Jon) and otter (Ming) ---------- */
function face(mood,y){
  var eyes = mood==="happy"
    ? '<path d="M36 '+y+' q4 -5 8 0 M56 '+y+' q4 -5 8 0" fill="none" stroke="#1F1B3A" stroke-width="2.6" stroke-linecap="round"/>'
    : '<circle cx="40" cy="'+y+'" r="3.2" fill="#1F1B3A"/><circle cx="60" cy="'+y+'" r="3.2" fill="#1F1B3A"/>';
  var mouth = mood==="sad" ? '<path d="M45 '+(y+13)+' q5 -5 10 0" fill="none" stroke="#1F1B3A" stroke-width="2.4" stroke-linecap="round"/>'
    : '<path d="M44 '+(y+10)+' q6 6 12 0" fill="none" stroke="#1F1B3A" stroke-width="2.4" stroke-linecap="round"/>';
  return eyes+'<ellipse cx="50" cy="'+(y+6)+'" rx="3.4" ry="2.4" fill="#1F1B3A"/>'+mouth+
    '<circle cx="32" cy="'+(y+8)+'" r="4" fill="#FF9FB8" opacity=".7"/><circle cx="68" cy="'+(y+8)+'" r="4" fill="#FF9FB8" opacity=".7"/>';
}
function bell(x,y,rot){return '<g transform="translate('+x+' '+y+') rotate('+rot+')"><rect x="-13" y="-2.5" width="26" height="5" rx="2" fill="#1F1B3A"/><rect x="-17" y="-8" width="7" height="16" rx="3" fill="#FFE58A" stroke="#1F1B3A" stroke-width="2"/><rect x="10" y="-8" width="7" height="16" rx="3" fill="#FFE58A" stroke="#1F1B3A" stroke-width="2"/></g>';}
function crown(){return '<path d="M34 16 l5 -12 l11 9 l11 -9 l5 12 z" fill="#FFE58A" stroke="#1F1B3A" stroke-width="2.4" stroke-linejoin="round"/>';}
function mascot(p,mood,size,king){
  var up = mood==="happy", S='stroke="#1F1B3A" stroke-width="2.6" stroke-linejoin="round"';
  var body;
  if(p==="jon"){ /* seal */
    body='<path d="M22 96 q-14 4 -18 -6 q10 -2 18 -8 z" fill="#8FB8EE" '+S+'/><path d="M78 96 q14 4 18 -6 q-10 -2 -18 -8 z" fill="#8FB8EE" '+S+'/>'+
      '<path d="M50 14 c22 0 30 18 30 36 c0 26 -6 48 -30 48 c-24 0 -30 -22 -30 -48 c0 -18 8 -36 30 -36 z" fill="#A9CBF5" '+S+'/>'+
      '<ellipse cx="50" cy="76" rx="16" ry="17" fill="#EAF3FF"/>'+
      '<path d="M22 '+(up?52:62)+' q-12 '+(up?-10:6)+' -10 '+(up?-22:18)+' q8 -2 14 '+(up?12:-8)+' z" fill="#8FB8EE" '+S+'/>'+
      '<path d="M78 '+(up?52:62)+' q12 '+(up?-10:6)+' 10 '+(up?-22:18)+' q-8 -2 -14 '+(up?12:-8)+' z" fill="#8FB8EE" '+S+'/>'+
      '<path d="M24 30 q26 -9 52 0 l0 7 q-26 -9 -52 0 z" fill="#F76FA8" '+S+'/>'+
      '<circle cx="42" cy="50" r="1.2" fill="#1F1B3A"/><circle cx="58" cy="50" r="1.2" fill="#1F1B3A"/>'+face(mood,40);
  } else { /* otter */
    body='<path d="M70 92 q22 6 24 -12 q-10 0 -20 2 z" fill="#E9A57C" '+S+'/>'+
      '<circle cx="27" cy="24" r="7" fill="#E9A57C" '+S+'/><circle cx="73" cy="24" r="7" fill="#E9A57C" '+S+'/>'+
      '<path d="M50 16 c20 0 28 14 28 30 c0 8 -2 12 -4 16 c4 8 4 36 -24 36 c-28 0 -28 -28 -24 -36 c-2 -4 -4 -8 -4 -16 c0 -16 8 -30 28 -30 z" fill="#F4BE98" '+S+'/>'+
      '<ellipse cx="50" cy="78" rx="15" ry="16" fill="#FFF1E2"/><ellipse cx="50" cy="48" rx="17" ry="12" fill="#FFF1E2"/>'+
      '<path d="M24 '+(up?56:64)+' q-10 '+(up?-10:4)+' -8 '+(up?-20:14)+' q8 -1 12 '+(up?10:-8)+' z" fill="#E9A57C" '+S+'/>'+
      '<path d="M76 '+(up?56:64)+' q10 '+(up?-10:4)+' 8 '+(up?-20:14)+' q-8 -1 -12 '+(up?10:-8)+' z" fill="#E9A57C" '+S+'/>'+
      '<path d="M25 30 q25 -8 50 0 l0 7 q-25 -8 -50 0 z" fill="#4F8DF7" '+S+'/>'+face(mood,42);
  }
  var db = up ? bell(50,22,0) : bell(84,86,-20);
  return '<svg class="mascot '+mood+'" width="'+size+'" height="'+size+'" viewBox="0 -8 100 112" role="img" aria-label="'+PEOPLE[p].pet+', '+mood+'">'+body+(up&&!king?db:"")+(king?crown():"")+(!up?db:"")+'</svg>';
}
function moodOf(p){var d=today(); if(d>=1&&d<=DAYS&&has(p,d)) return "happy"; if(d>1&&d<=DAYS+1&&!has(p,Math.min(d-1,DAYS))) return "sad"; return "idle";}
function isKing(p){return today()>DAYS&&misses(p)===0;}
var FLAME='<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M7 1 c1 4 5 5 5 9 a5 5 0 0 1 -10 0 c0 -2 1 -3 2 -4 c0 2 1 2 2 2 c-1 -3 0 -5 1 -7 z" fill="#FFB347" stroke="#1F1B3A" stroke-width="1.6" stroke-linejoin="round"/></svg>';
var PLAY='<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 4 20 12 6 20" fill="#1F1B3A"/></svg>';

/* ---------- views ---------- */
function vWho(){
  return '<header style="text-align:center;padding-top:10px"><h1 style="font-size:44px">Sweat or Treat</h1><p class="muted" style="margin:6px 0 0">14 days. Two players. Dinner on the line.</p></header>'+
   '<h2 style="text-align:center;font-size:26px">Who are you?</h2><div class="who">'+
   ["jon","ming"].map(function(p){return '<button class="bg-'+p+'" data-who="'+p+'">'+mascot(p,"idle",110,false)+'<span class="n">'+PEOPLE[p].name+'</span><span class="muted" style="font-size:13px">with '+PEOPLE[p].pet+'</span></button>';}).join("")+'</div>';
}
function playerCard(p){
  var st=streak(p);
  return '<div class="card player bg-'+p+'">'+mascot(p,moodOf(p),84,isKing(p))+
    '<span class="n">'+PEOPLE[p].name+(p===me?' <span class="tag" style="background:#fff">you</span>':'')+'</span>'+
    '<span style="font-size:13px">'+doneCount(p)+' done · '+misses(p)+' missed</span>'+
    '<span class="flame">'+FLAME+st+' day streak</span></div>';
}
function dotFor(p,d,t){
  if(has(p,d)) return '<span class="m ok '+p+'" title="'+PEOPLE[p].name+' done"></span>';
  if(d<t) return '<span class="m" title="'+PEOPLE[p].name+' missed">×</span>';
  if(d===t) return '<span class="m todo '+p+'" title="'+PEOPLE[p].name+' still to do"></span>';
  return '<span class="m future"></span>';
}
function grid(){
  var t=today(),h="";
  for(var d=1;d<=DAYS;d++) h+='<div class="day '+(d===t?"today":d<t?"past":"future")+'">'+d+dotFor("jon",d,t)+dotFor("ming",d,t)+'</div>';
  return h;
}
function owesLine(){
  var a=owes("jon"),b=owes("ming"),o=[];
  if(a) o.push("Jon owes Ming "+a+".");
  if(b) o.push("Ming owes Jon "+b+".");
  return o.length?o.join(" "):"Nobody owes anything yet. Keep it that way.";
}
function todayCard(){
  var t=today(), o=other(me), on=PEOPLE[o].name, mn=PEOPLE[me].name;
  if(t<1) return '<div class="card"><h2 style="font-size:22px">Starts soon</h2><p class="muted" style="margin:6px 0 0">Day 1 is 15 November.</p></div>';
  if(t>DAYS) return '<div class="card"><h2 style="font-size:24px">Challenge complete</h2><p style="margin:6px 0 0">'+owesLine()+'</p></div>';
  var ot=tickOf(o,t), mine=has(me,t), line;
  if(mine&&ot) line="You both did it. Nobody pays for today.";
  else if(mine) line=on+" hasn't ticked yet. Go poke "+on+".";
  else if(ot) line=on+" ticked at "+clock(ot.ticked_at)+". Your turn, "+mn+".";
  else line="Neither of you has ticked yet. First one done gets bragging rights.";
  var act = mine
    ? '<div class="done row"><div style="flex:1;min-width:0"><h3>Day '+t+' done. Nice one!</h3><span style="font-size:13px">You can undo until midnight.</span></div><button class="small" id="undo">Undo</button></div>'
    : '<button class="big" id="tick"'+(loaded?"":" disabled")+'>I did it!</button>';
  return '<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row between"><h2 style="font-size:22px">Today\'s workout</h2>'+
    '<a class="pill white" href="'+VIDEO+'" target="_blank" rel="noopener">'+PLAY+'Open video</a></div><div class="muted" style="font-size:14px">'+line+'</div>'+act+'</div>';
}
function vHome(){
  var t=today(), dn=Math.max(0,Math.min(t,DAYS));
  var pj=Math.round(doneCount("jon")/DAYS*100), pm=Math.round(doneCount("ming")/DAYS*100);
  return '<header class="row between"><div><div class="eyebrow">'+(t<1?"Not started":t>DAYS?"Finished":"Day "+dn+" of "+DAYS)+'</div><h1 style="font-size:34px">Sweat or Treat</h1></div>'+
    '<button class="pill" data-view="stakes">The stakes</button></header>'+
    (failed?'<div class="card err row between"><span>Can\'t reach the scoreboard. Check your connection.</span><button class="small" id="retry">Retry</button></div>':'')+
    '<div class="players">'+playerCard("jon")+playerCard("ming")+'</div>'+todayCard()+
    '<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="row between"><h2 style="font-size:22px">The 14 days</h2>'+
    '<div class="legend"><span><i class="dot jon"></i> Jon</span><span><i class="dot ming"></i> Ming</span></div></div>'+
    '<div class="grid">'+grid()+'</div><div class="muted" style="font-size:12px">Filled = done · ring = still to do today · × = missed</div>'+
    '<div class="bar" role="img" aria-label="Jon '+pj+' percent"><i style="width:'+pj+'%;background:var(--jon)"></i></div>'+
    '<div class="bar" role="img" aria-label="Ming '+pm+' percent"><i style="width:'+pm+'%;background:var(--ming)"></i></div></div>'+
    '<div class="card banner">'+owesLine()+'</div>'+
    '<div style="text-align:center"><button class="link" id="switch">Not '+PEOPLE[me].name+'? Switch player</button></div>';
}
function vStakes(){
  var names=["Krua Bangna","Japanese dinner","Omakase"], cols=["var(--butter)","#FFC68A","#FF9FA8"], h="";
  for(var i=1;i<=3;i++){
    var here=["jon","ming"].filter(function(p){return Math.min(misses(p),3)===i;}).map(function(p){return '<span class="tag bg-'+p+'">'+PEOPLE[p].name+' is here</span>';}).join("");
    h+='<div class="card tier"><div class="num" style="background:'+cols[i-1]+'">'+i+'</div><div style="flex:1;min-width:0"><div class="eyebrow">Miss '+i+(i===3?" or more":"")+" day"+(i>1?"s":"")+'</div><h3>'+names[i-1]+'</h3></div><div class="here">'+here+'</div></div>';
  }
  return '<header class="row between"><h1 style="font-size:34px">The stakes</h1><button class="pill white" data-view="home">Back</button></header>'+
    '<p class="muted" style="margin:0">Miss a day and you treat the other one. Only your highest tier counts.</p>'+h+
    '<div class="card" style="background:var(--mint);display:flex;flex-direction:column;gap:4px"><h3 style="font-size:20px">Scoreboard</h3>'+
    ["jon","ming"].map(function(p){var o=owes(p);return '<div class="score"><span><i class="dot '+p+'"></i> '+PEOPLE[p].name+'</span><span>'+misses(p)+' missed · '+(o?"owes "+o:"safe")+'</span></div>';}).join("")+'</div>'+
    '<div class="card" style="display:flex;flex-direction:column;gap:6px"><h3 style="font-size:20px">House rules</h3>'+
    '<span class="muted">A day closes at midnight, Bangkok time. No tick by then is a miss.</span>'+
    '<span class="muted">You can only tick today, and only for yourself. Undo works until midnight.</span>'+
    '<span class="muted">You each owe for your own misses, so you can both end up paying.</span>'+
    '<span class="muted">Finish all 14 with zero misses and your mascot gets a crown.</span></div>';
}
function render(){
  var app=document.getElementById("app");
  app.innerHTML = !me ? vWho() : view==="stakes" ? vStakes() : vHome();
}
document.getElementById("app").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.dataset.who){ me=b.dataset.who; try{localStorage.setItem("sot:me",me);}catch(x){} view="home"; render(); }
  else if(b.dataset.view){ view=b.dataset.view; render(); window.scrollTo(0,0); }
  else if(b.id==="tick") tick();
  else if(b.id==="undo") undo();
  else if(b.id==="retry") load();
  else if(b.id==="switch"){ me=null; try{localStorage.removeItem("sot:me");}catch(x){} render(); }
});

/* ---------- confetti ---------- */
function confetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c=document.getElementById("confetti"),x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight;
  var cols=["#4F8DF7","#F76FA8","#FFE58A","#A9EFD0","#B9A7F5"],ps=[],i,t0=performance.now();
  for(i=0;i<120;i++) ps.push({x:W/2,y:H*0.45,vx:(Math.random()-0.5)*14,vy:-Math.random()*13-3,s:Math.random()*8+5,c:cols[i%5],r:Math.random()*6});
  (function step(now){
    x.clearRect(0,0,W,H);
    ps.forEach(function(p){p.vy+=0.35;p.x+=p.vx;p.y+=p.vy;p.r+=0.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);x.restore();});
    if(now-t0<2200) requestAnimationFrame(step); else x.clearRect(0,0,W,H);
  })(t0);
}

render(); load();
setInterval(function(){ if(!busy&&!document.hidden) load(); },15000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden&&!busy) load(); });
})();
